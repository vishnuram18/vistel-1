<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vistel - Sign Up</title>
    <link rel="stylesheet" href="../css/signup.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="signup-container">
        <div class="brand-header">VISTEL</div>
        <h1>Create your account</h1>
        <div class="form-signup">
            <ul class="signup-nav">
                <li class="signup-nav_item">
                    <a href="signin.html">Sign In</a>
                </li>
                <li class="signup-nav_item active">
                    <a href="#">Sign Up</a>
                </li>
            </ul>
            <label for="signup-input-email" class="signup-label">Email</label>
            <input id="signup-input-email" class="signup-input" type="email" required />
            <label for="signup-input-password" class="signup-label">Password</label>
            <input id="signup-input-password" class="signup-input" type="password" required />
            <label for="signup-input-confirm-password" class="signup-label">Confirm Password</label>
            <input id="signup-input-confirm-password" class="signup-input" type="password" required />
            <p id="error-msg" style="color:#e50914;font-size:0.85rem;min-height:1.2em;"></p>
            <button class="signup-submit" type="button" id="submit">SIGN UP</button>
        </div>
        <a href="signin.html" class="signup-login">Already have an account? Sign In</a>
    </div>

    <script type="module">
        import { app } from "../javascript/firebase-config.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        const auth = getAuth(app);
        const db = getFirestore(app);
        const btn = document.getElementById('submit');
        const errMsg = document.getElementById('error-msg');

        btn.addEventListener('click', async () => {
            const email = document.getElementById("signup-input-email").value.trim();
            const password = document.getElementById("signup-input-password").value;
            const confirmPassword = document.getElementById("signup-input-confirm-password").value;

            errMsg.textContent = '';

            if (!email || !password) {
                errMsg.textContent = 'Please fill in all fields.';
                return;
            }
            if (password.length < 6) {
                errMsg.textContent = 'Password must be at least 6 characters.';
                return;
            }
            if (password !== confirmPassword) {
                errMsg.textContent = 'Passwords do not match.';
                return;
            }

            btn.textContent = 'Creating account...';
            btn.disabled = true;

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Write user doc in background — don't block redirect on Firestore
                setDoc(doc(db, 'users', user.uid), {
                    email: email,
                    signup_date: serverTimestamp(),
                    last_login: serverTimestamp(),
                    language: null,
                    subscription: null
                }).catch(() => {});

                window.location.assign("language-selection.html");
            } catch (error) {
                errMsg.textContent = error.message.replace('Firebase: ', '');
                btn.textContent = 'SIGN UP';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
