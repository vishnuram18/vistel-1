<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vistel - Profile</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/profile1.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="motioncomics.html">Motion Comics</a></li>
                <li><a href="voiceplayer.html">Voice Books</a></li>
                <li><a href="subscription.html">Subscription</a></li>
                <li><a href="profile.html" class="active">Profile</a></li>
            </ul>
        </nav>
    </header>

    <div class="profile-wrapper">
        <div class="profile-header">
            <div class="profile-image">
                <img id="profile-avatar" src="../image/Akatsuki.jpg" alt="Profile Image">
            </div>
            <div class="profile-info">
                <h2 id="profile-name">Loading...</h2>
                <p id="profile-email"></p>
                <p id="profile-plan" class="profile-plan"></p>
                <p id="profile-language" class="profile-language"></p>
                <div class="profile-actions">
                    <button id="sign-out-btn" class="signout-btn">Sign Out</button>
                </div>
            </div>
        </div>

        <div class="content">
            <div class="progress-section">
                <h2>Watching Progress</h2>
                <ul class="progress-list" id="watching-list">
                    <li class="empty-msg">No motion comics watched yet.</li>
                </ul>
            </div>
            <div class="progress-section">
                <h2>Listening Progress</h2>
                <ul class="progress-list" id="listening-list">
                    <li class="empty-msg">No voice books started yet.</li>
                </ul>
            </div>
        </div>
    </div>

    <script type="module">
        import { app, rtdb } from "../javascript/firebase-config.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
        import { ref, onValue } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.assign("signin.html");
                return;
            }

            // Load user profile from Firestore
            const userSnap = await getDoc(doc(db, 'users', user.uid));
            const userData = userSnap.exists() ? userSnap.data() : {};

            const displayName = userData.displayName || user.email.split('@')[0];
            document.getElementById('profile-name').textContent = displayName;
            document.getElementById('profile-email').textContent = user.email;

            if (userData.subscription && userData.subscription.plan) {
                const plan = userData.subscription.plan;
                document.getElementById('profile-plan').textContent =
                    plan.charAt(0).toUpperCase() + plan.slice(1) + ' Plan';
            } else {
                document.getElementById('profile-plan').textContent = 'No active subscription';
                document.getElementById('profile-plan').classList.add('muted');
            }

            if (userData.language) {
                document.getElementById('profile-language').textContent = 'Language: ' + userData.language;
            }

            // Real-time progress from RTDB — updates live across devices
            onValue(ref(rtdb, `progress/${user.uid}`), (snap) => {
                const watchingList = document.getElementById('watching-list');
                const listeningList = document.getElementById('listening-list');

                const motionComics = [];
                const voiceBooks = [];

                if (snap.exists()) {
                    const data = snap.val();
                    if (data.motioncomics) {
                        Object.values(data.motioncomics).forEach(item => motionComics.push(item));
                    }
                    if (data.voicebooks) {
                        Object.values(data.voicebooks).forEach(item => voiceBooks.push(item));
                    }
                }

                watchingList.innerHTML = motionComics.length > 0
                    ? motionComics.map(item => `
                        <li class="progress-item">
                            <div class="progress-details">
                                <h3>${item.title || item.contentId}</h3>
                                <p>${item.progressPercent || 0}% watched</p>
                                <div class="progress-bar">
                                    <div class="progress" style="width:${item.progressPercent || 0}%;"></div>
                                </div>
                            </div>
                        </li>`).join('')
                    : '<li class="empty-msg">No motion comics watched yet.</li>';

                listeningList.innerHTML = voiceBooks.length > 0
                    ? voiceBooks.map(item => `
                        <li class="progress-item">
                            ${item.thumbnail ? `<img src="${item.thumbnail}" alt="${item.title || ''}">` : ''}
                            <div class="progress-details">
                                <h3>${item.title || item.contentId}</h3>
                                <p>${item.progressPercent || 0}% listened</p>
                                <div class="progress-bar">
                                    <div class="progress" style="width:${item.progressPercent || 0}%;"></div>
                                </div>
                            </div>
                        </li>`).join('')
                    : '<li class="empty-msg">No voice books started yet.</li>';
            });
        });

        document.getElementById('sign-out-btn').addEventListener('click', async () => {
            await signOut(auth);
            window.location.assign("signin.html");
        });
    </script>
</body>
</html>
