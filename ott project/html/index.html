<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vistel</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="motioncomics.html">Motion Comics</a></li>
                <li><a href="voiceplayer.html">Voice Books</a></li>
                <li><a href="subscription.html">Subscription</a></li>
                <li><a href="profile.html">Profile</a></li>
            </ul>
            <div id="auth-nav"></div>
        </nav>
    </header>

    <button id="genre-button" class="genre-button" aria-label="Browse genres">
        <i class="fas fa-list"></i>
    </button>

    <div id="genre-list" class="genre-list">
        <a href="genre.html?type=most-popular" class="genre-item color-popular">Most Popular</a>
        <a href="genre.html?type=trending" class="genre-item color-trending">Trending</a>
        <a href="genre.html?type=imdb" class="genre-item color-imdb">IMDB</a>
        <a href="genre.html?type=moco-movies" class="genre-item color-moco">Moco Movies</a>
        <span class="genre-heading">Genre</span>
        <a href="genre.html?type=action" class="genre-item color-action">Action</a>
        <a href="genre.html?type=drama" class="genre-item color-drama">Drama</a>
        <a href="genre.html?type=comedy" class="genre-item color-comedy">Comedy</a>
        <a href="genre.html?type=horror" class="genre-item color-horror">Horror</a>
        <a href="genre.html?type=sci-fi" class="genre-item color-sci-fi">Sci-Fi</a>
        <a href="genre.html?type=fantasy" class="genre-item color-fantasy">Fantasy</a>
        <a href="genre.html?type=romance" class="genre-item color-romance">Romance</a>
    </div>

    <!-- Live announcements from RTDB -->
    <div id="announcements-bar" style="display:none;"></div>

    <section class="hero">
        <div class="hero-content">
            <h1 class="brand-title">VISTEL</h1>
            <p>Your favorite motion comics in one place.</p>
            <div id="hero-actions">
                <a href="subscription.html" class="btn btn-primary">Subscribe Now</a>
                <a href="signin.html" class="btn btn-ghost" id="hero-login-btn">Login</a>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2024 Vistel. All rights reserved.</p>
    </footer>

    <script type="module">
        import { app, rtdb } from "../javascript/firebase-config.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
        import { ref, onValue, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

        // Live announcements — show the latest active announcement
        onValue(query(ref(rtdb, 'announcements'), orderByChild('timestamp'), limitToLast(1)), (snap) => {
            const bar = document.getElementById('announcements-bar');
            if (!snap.exists()) { bar.style.display = 'none'; return; }
            let latest = null;
            snap.forEach(child => { latest = child.val(); });
            if (latest && latest.active) {
                bar.textContent = '📢 ' + latest.message;
                bar.style.display = 'block';
            } else {
                bar.style.display = 'none';
            }
        });

        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            const authNav = document.getElementById('auth-nav');
            const heroLoginBtn = document.getElementById('hero-login-btn');

            if (user) {
                // Hide the login hero button, show user greeting + logout
                heroLoginBtn.style.display = 'none';

                let displayName = user.email.split('@')[0];
                try {
                    const snap = await getDoc(doc(db, 'users', user.uid));
                    if (snap.exists() && snap.data().displayName) {
                        displayName = snap.data().displayName;
                    }
                } catch (_) {}

                authNav.innerHTML = `
                    <span class="auth-greeting">Hi, ${displayName}</span>
                    <button id="logout-btn" class="signout-btn">Sign Out</button>
                `;

                document.getElementById('logout-btn').addEventListener('click', async () => {
                    await signOut(auth);
                    window.location.reload();
                });
            } else {
                authNav.innerHTML = `<a href="signin.html">Sign In</a>`;
            }
        });

        document.getElementById('genre-button').addEventListener('click', () => {
            document.getElementById('genre-list').classList.toggle('open');
        });
    </script>
</body>
</html>
