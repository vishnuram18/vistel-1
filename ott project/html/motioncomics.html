<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vistel - Motion Comics</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/motiomcomics.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="motioncomics.html" class="active">Motion Comics</a></li>
                <li><a href="voiceplayer.html">Voice Books</a></li>
                <li><a href="subscription.html">Subscription</a></li>
                <li><a href="profile.html">Profile</a></li>
            </ul>
        </nav>
    </header>

    <div class="content-wrapper">
        <h2 class="section-title">MotionComics Collection</h2>
        <div class="item-list" id="item-list">
            <p id="loading-msg" class="loading-msg">Loading content...</p>
        </div>
    </div>

    <!-- Video Player -->
    <div id="videoPlayerContainer" class="video-player-container">
        <video id="videoPlayer" controls>
            <source id="videoSource" src="" type="video/mp4">
            Your browser does not support the video element.
        </video>
        <button class="close-button">&times;</button>
    </div>

    <script type="module">
        import { app, rtdb } from "../javascript/firebase-config.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import { ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

        const auth = getAuth(app);
        let currentUser = null;
        let activeContentId = null;
        let activeTitle = '';
        let saveTimer = null;

        const videoPlayerContainer = document.getElementById('videoPlayerContainer');
        const videoPlayer = document.getElementById('videoPlayer');
        const videoSource = document.getElementById('videoSource');
        const closeButton = document.querySelector('.close-button');
        const itemList = document.getElementById('item-list');

        // Track auth state; attach progress listeners once user is known
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                // Real-time progress bars for all rendered cards
                onValue(ref(rtdb, `progress/${user.uid}/motioncomics`), (snap) => {
                    if (!snap.exists()) return;
                    snap.forEach(child => {
                        const bar = document.getElementById('progress-' + child.key);
                        if (bar && child.val().progressPercent !== undefined) {
                            bar.style.width = child.val().progressPercent + '%';
                        }
                    });
                });
            }
        });

        // Live content catalog — updates instantly when admin adds/removes content
        onValue(ref(rtdb, 'content/motioncomics'), (snap) => {
            document.getElementById('loading-msg')?.remove();
            itemList.innerHTML = '';

            if (!snap.exists()) {
                itemList.innerHTML = '<p class="empty-msg">No content available yet.</p>';
                return;
            }

            snap.forEach(child => {
                itemList.appendChild(buildCard(child.val()));
            });
        });

        function buildCard(item) {
            const div = document.createElement('div');
            div.className = 'item';
            div.setAttribute('data-id', item.id);
            div.innerHTML = `
                <img src="../${item.thumbnail}" alt="${item.title}">
                <h3>${item.title}</h3>
                <p>Author: ${item.author}</p>
                <div class="item-progress-bar">
                    <div class="item-progress" id="progress-${item.id}" style="width:0%;"></div>
                </div>
            `;
            div.addEventListener('click', () => openItem(item));
            return div;
        }

        async function openItem(item) {
            activeContentId = item.id;
            activeTitle = item.title;

            let startTime = 0;
            if (currentUser) {
                try {
                    const snap = await get(ref(rtdb, `progress/${currentUser.uid}/motioncomics/${item.id}/currentTime`));
                    if (snap.exists()) startTime = snap.val();
                } catch (_) {}
            }

            videoSource.src = `../videos/${item.video}`;
            videoPlayer.load();
            videoPlayer.addEventListener('loadedmetadata', () => {
                videoPlayer.currentTime = startTime;
                videoPlayer.play();
            }, { once: true });

            videoPlayerContainer.classList.add('show');

            clearInterval(saveTimer);
            saveTimer = setInterval(saveProgress, 5000);
        }

        async function saveProgress() {
            if (!currentUser || !activeContentId || !videoPlayer.duration) return;
            const percent = Math.round((videoPlayer.currentTime / videoPlayer.duration) * 100);
            try {
                await set(ref(rtdb, `progress/${currentUser.uid}/motioncomics/${activeContentId}`), {
                    contentId: activeContentId,
                    title: activeTitle,
                    currentTime: videoPlayer.currentTime,
                    progressPercent: percent,
                    lastWatched: Date.now()
                });
            } catch (_) {}
        }

        closeButton.addEventListener('click', () => {
            clearInterval(saveTimer);
            saveProgress();
            videoPlayer.pause();
            videoPlayerContainer.classList.remove('show');
        });

        videoPlayer.addEventListener('ended', () => {
            clearInterval(saveTimer);
            saveProgress();
            videoPlayerContainer.classList.remove('show');
        });
    </script>
</body>
</html>
