<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vistel - Sign In</title>
    <link rel="stylesheet" href="../css/sigin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="brand-header">VISTEL</div>
        <h1>Welcome back</h1>
        <div class="form-login">
            <ul class="login-nav">
                <li class="login-nav_item active">
                    <a href="#">Sign In</a>
                </li>
                <li class="login-nav_item">
                    <a href="signup.html">Sign Up</a>
                </li>
            </ul>
            <label for="login-input-email" class="login-label">Email</label>
            <input id="login-input-email" class="login-input" type="email" />
            <label for="login-input-password" class="login-label">Password</label>
            <input id="login-input-password" class="login-input" type="password" />
            <label for="login-sign-up" class="login-label--checkbox">
                <input id="login-sign-up" type="checkbox" class="login__input--checkbox" />
                Keep me Signed in
            </label>
            <p id="error-msg" style="color:#e50914;font-size:0.85rem;min-height:1.2em;"></p>
            <button class="login-submit" type="button" id="submit">SIGN IN</button>
        </div>
        <a href="#" id="forgot-link" class="login-forgot">Forgot Password?</a>
    </div>

    <script type="module">
        import { app } from "../javascript/firebase-config.js";
        import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, setPersistence, browserLocalPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import { getFirestore, doc, updateDoc, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        const auth = getAuth(app);
        const db = getFirestore(app);
        const btn = document.getElementById('submit');
        const errMsg = document.getElementById('error-msg');

        btn.addEventListener('click', async () => {
            const email = document.getElementById("login-input-email").value.trim();
            const password = document.getElementById("login-input-password").value;
            const keepSignedIn = document.getElementById("login-sign-up").checked;

            errMsg.textContent = '';

            if (!email || !password) {
                errMsg.textContent = 'Please enter both email and password.';
                return;
            }

            btn.textContent = 'Signing In...';
            btn.disabled = true;

            try {
                const persistence = keepSignedIn ? browserLocalPersistence : browserSessionPersistence;
                await setPersistence(auth, persistence);

                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Update last login & ensure user doc exists
                const userRef = doc(db, 'users', user.uid);
                const userSnap = await getDoc(userRef);

                if (userSnap.exists()) {
                    await updateDoc(userRef, { last_login: serverTimestamp() });
                } else {
                    // First login after account migration — create doc
                    const { setDoc } = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js");
                    await setDoc(userRef, {
                        email: user.email,
                        signup_date: serverTimestamp(),
                        last_login: serverTimestamp(),
                        language: null,
                        subscription: null
                    });
                }

                // Redirect to language selection if no language set yet, else home
                const data = (await getDoc(userRef)).data();
                if (!data.language) {
                    window.location.assign("language-selection.html");
                } else {
                    window.location.assign("index.html");
                }
            } catch (error) {
                errMsg.textContent = error.message.replace('Firebase: ', '');
            } finally {
                btn.textContent = 'SIGN IN';
                btn.disabled = false;
            }
        });

        document.getElementById('forgot-link').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById("login-input-email").value.trim();
            if (!email) {
                errMsg.textContent = 'Enter your email above, then click Forgot Password.';
                return;
            }
            try {
                await sendPasswordResetEmail(getAuth(app), email);
                errMsg.style.color = '#00b4d8';
                errMsg.textContent = 'Password reset email sent. Check your inbox.';
            } catch (error) {
                errMsg.style.color = '#e50914';
                errMsg.textContent = error.message.replace('Firebase: ', '');
            }
        });
    </script>
</body>
</html>
