<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vistel - Voice Books</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/voiceplayer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="motioncomics.html">Motion Comics</a></li>
                <li><a href="voiceplayer.html" class="active">Voice Books</a></li>
                <li><a href="subscription.html">Subscription</a></li>
                <li><a href="profile.html">Profile</a></li>
            </ul>
        </nav>
    </header>

    <div class="content-wrapper">
        <h2 class="section-title">Voice Books</h2>
        <div class="item-list" id="item-list">
            <p id="loading-msg" class="loading-msg">Loading content...</p>
        </div>
    </div>

    <!-- Audio Player -->
    <div id="audioPlayerContainer" class="audio-player-container" style="display:none;">
        <div class="audio-player-inner">
            <img id="audioThumbnail" src="" alt="Cover" class="audio-thumb">
            <div class="audio-info">
                <h3 id="audioTitle">—</h3>
                <p id="audioAuthor">—</p>
                <input type="range" id="audioSeekBar" value="0" min="0" step="1">
                <div class="audio-meta-row">
                    <span id="audioCurrentTime">0:00</span>
                    <span id="audioDuration">0:00</span>
                </div>
            </div>
            <div class="audio-controls">
                <button id="rewindBtn" title="Rewind 10s"><i class="fas fa-backward"></i></button>
                <button id="playPauseButton"><i class="fas fa-play"></i></button>
                <button id="forwardBtn" title="Forward 10s"><i class="fas fa-forward"></i></button>
            </div>
            <button id="closeAudioPlayer" title="Close"><i class="fas fa-times"></i></button>
        </div>
        <audio id="audioPlayer">
            <source id="audioSource" src="" type="audio/mpeg">
        </audio>
    </div>

    <script type="module">
        import { app, rtdb } from "../javascript/firebase-config.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import { ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

        const auth = getAuth(app);
        let currentUser = null;
        let activeContentId = null;
        let activeThumbnail = '';
        let saveTimer = null;

        const audioPlayer = document.getElementById('audioPlayer');
        const audioSource = document.getElementById('audioSource');
        const playerContainer = document.getElementById('audioPlayerContainer');
        const playPauseBtn = document.getElementById('playPauseButton');
        const seekBar = document.getElementById('audioSeekBar');
        const currentTimeEl = document.getElementById('audioCurrentTime');
        const durationEl = document.getElementById('audioDuration');
        const itemList = document.getElementById('item-list');

        function formatTime(secs) {
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        // Track auth state; attach real-time progress listeners when user signs in
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                onValue(ref(rtdb, `progress/${user.uid}/voicebooks`), (snap) => {
                    if (!snap.exists()) return;
                    snap.forEach(child => {
                        const bar = document.getElementById('progress-' + child.key);
                        if (bar && child.val().progressPercent !== undefined) {
                            bar.style.width = child.val().progressPercent + '%';
                        }
                    });
                });
            }
        });

        // Live voice book catalog
        onValue(ref(rtdb, 'content/voicebooks'), (snap) => {
            document.getElementById('loading-msg')?.remove();
            itemList.innerHTML = '';

            if (!snap.exists()) {
                itemList.innerHTML = '<p class="empty-msg">No content available yet.</p>';
                return;
            }

            snap.forEach(child => {
                itemList.appendChild(buildCard(child.val()));
            });
        });

        function buildCard(item) {
            const div = document.createElement('div');
            div.className = 'item';
            div.setAttribute('data-id', item.id);
            div.innerHTML = `
                <img src="../${item.thumbnail}" alt="${item.title}">
                <h3>${item.title}</h3>
                <p>${item.author} &bull; ${item.chapters} chapters</p>
                <div class="item-progress-bar">
                    <div class="item-progress" id="progress-${item.id}" style="width:0%;"></div>
                </div>
            `;
            div.addEventListener('click', () => openItem(item));
            return div;
        }

        async function openItem(item) {
            activeContentId = item.id;
            activeThumbnail = `../${item.thumbnail}`;

            document.getElementById('audioTitle').textContent = item.title;
            document.getElementById('audioAuthor').textContent = item.author;
            document.getElementById('audioThumbnail').src = activeThumbnail;

            audioSource.src = `../${item.audio}`;
            audioPlayer.load();

            let startTime = 0;
            if (currentUser) {
                try {
                    const snap = await get(ref(rtdb, `progress/${currentUser.uid}/voicebooks/${item.id}/currentTime`));
                    if (snap.exists()) startTime = snap.val();
                } catch (_) {}
            }

            audioPlayer.addEventListener('loadedmetadata', () => {
                audioPlayer.currentTime = startTime;
                audioPlayer.play();
                playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
                seekBar.max = Math.floor(audioPlayer.duration);
                durationEl.textContent = formatTime(audioPlayer.duration);
            }, { once: true });

            if (audioPlayer.readyState >= 1) {
                audioPlayer.currentTime = startTime;
                audioPlayer.play();
                playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
            }

            playerContainer.style.display = 'flex';
            clearInterval(saveTimer);
            saveTimer = setInterval(saveProgress, 5000);
        }

        async function saveProgress() {
            if (!currentUser || !activeContentId || !audioPlayer.duration) return;
            const percent = Math.round((audioPlayer.currentTime / audioPlayer.duration) * 100);
            const itemEl = document.querySelector(`[data-id="${activeContentId}"]`);
            const title = itemEl?.querySelector('h3')?.textContent || '';
            try {
                await set(ref(rtdb, `progress/${currentUser.uid}/voicebooks/${activeContentId}`), {
                    contentId: activeContentId,
                    title,
                    thumbnail: activeThumbnail,
                    currentTime: audioPlayer.currentTime,
                    progressPercent: percent,
                    lastWatched: Date.now()
                });
            } catch (_) {}
        }

        playPauseBtn.addEventListener('click', () => {
            if (audioPlayer.paused) {
                audioPlayer.play();
                playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
            } else {
                audioPlayer.pause();
                playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
            }
        });

        document.getElementById('rewindBtn').addEventListener('click', () => {
            audioPlayer.currentTime = Math.max(0, audioPlayer.currentTime - 10);
        });

        document.getElementById('forwardBtn').addEventListener('click', () => {
            audioPlayer.currentTime = Math.min(audioPlayer.duration, audioPlayer.currentTime + 10);
        });

        audioPlayer.addEventListener('timeupdate', () => {
            currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
            if (audioPlayer.duration) seekBar.value = Math.floor(audioPlayer.currentTime);
        });

        audioPlayer.addEventListener('loadedmetadata', () => {
            seekBar.max = Math.floor(audioPlayer.duration);
            durationEl.textContent = formatTime(audioPlayer.duration);
        });

        seekBar.addEventListener('input', () => {
            audioPlayer.currentTime = seekBar.value;
        });

        audioPlayer.addEventListener('ended', () => {
            clearInterval(saveTimer);
            saveProgress();
            playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
        });

        document.getElementById('closeAudioPlayer').addEventListener('click', () => {
            clearInterval(saveTimer);
            saveProgress();
            audioPlayer.pause();
            playerContainer.style.display = 'none';
            playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
        });
    </script>
</body>
</html>
